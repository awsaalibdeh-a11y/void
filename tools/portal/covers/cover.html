<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; background: #06070b; overflow: hidden; }
  #c { position: relative; overflow: hidden; background: #06070b; }
  #c img { position: absolute; }
  .fade { position: absolute; inset: 0; }
  .t { position: absolute; color: #fff; font-family: Unbounded, sans-serif; }
  .t h1 { margin: 0; font-weight: 900; letter-spacing: .04em; line-height: .9; text-shadow: 0 6px 40px rgba(0,0,0,.7); }
  .t h1 i { font-style: normal; color: #ff2a3a; }
  .t p { margin: .35em 0 0; font-size: 1.9em; font-weight: 900; letter-spacing: .28em; color: #ffd23d; text-shadow: 0 2px 14px rgba(0,0,0,.8); }
  .t small { display: block; margin-top: .9em; font: 600 1em Inter, sans-serif; letter-spacing: .4em; color: rgba(255,255,255,.7); }
</style></head>
<body><div id="c"><img id="i" src="hero.png"><div class="fade" id="f"></div><div class="t" id="t"><h1>V<i>O</i>ID</h1><p>NEW LEGION</p><small>DRIVE · FLY · RACE</small></div></div>
<script>
// cover.html?w=1920&h=1080&cx=.62&cy=.62&car=.5  -> the car (52%,50% of hero.png, 41% of its width) placed at (cx,cy), car width = car * min(w,h)... title layout per shape
const q = new URLSearchParams(location.search), W = +q.get("w"), H = +q.get("h");
const cx = +q.get("cx"), cy = +q.get("cy"), carW = +q.get("car") * W;
const IW = 2880, IH = 1620, FX = .52, FY = .5, CAR = .41;
const s = carW / (CAR * IW), iw = IW * s, ih = IH * s;
const c = document.getElementById("c"); c.style.width = W + "px"; c.style.height = H + "px";
const i = document.getElementById("i"); i.style.width = iw + "px"; i.style.height = ih + "px";
let x0 = cx * W - FX * iw, y0 = cy * H - FY * ih;
x0 = Math.min(0, Math.max(W - iw, x0)); if (y0 + ih < H) y0 = H - ih;
i.style.left = x0 + "px"; i.style.top = y0 + "px";
const f = document.getElementById("f"), t = document.getElementById("t"), shape = q.get("shape");
const topFade = Math.max(0, y0) / H * 100;
f.style.background = `linear-gradient(180deg, #06070b 0%, #06070b ${topFade}%, rgba(6,7,11,.0) ${topFade + 22}%, rgba(6,7,11,0) 70%, rgba(6,7,11,.75) 100%)` + (shape === "land" ? ", linear-gradient(90deg, rgba(6,7,11,.85) 0%, rgba(6,7,11,0) 50%)" : ", linear-gradient(180deg, rgba(6,7,11,.9) 0%, rgba(6,7,11,.75) 36%, rgba(6,7,11,0) 56%)");
const base = Math.min(W, H);
if (shape === "land") { t.style.left = W * .055 + "px"; t.style.top = H * .1 + "px"; t.querySelector("h1").style.fontSize = H * .25 + "px"; t.style.fontSize = H * .028 + "px"; }
else { t.style.left = 0; t.style.right = 0; t.style.textAlign = "center"; t.style.top = H * (shape === "port" ? .07 : .06) + "px"; t.querySelector("h1").style.fontSize = base * (shape === "port" ? .26 : .22) + "px"; t.style.fontSize = base * .034 + "px"; }
document.fonts.ready.then(() => document.title = "ready");
</script></body></html>
